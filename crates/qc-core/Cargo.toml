[package]
name = "qc-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
image = "0.25"
# Must match qc-audio: probe and mix have to accept the same formats, or a file
# that checks fine fails on render.
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }
rayon = "1"
