[package]
name = "qc-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "quickcut"
path = "src/main.rs"

[dependencies]
qc-core = { path = "../qc-core" }
qc-export = { path = "../qc-export" }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
rayon = "1.10"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"