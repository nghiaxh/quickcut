[workspace]
resolver = "2"
members = [
    "crates/qc-core",
    "crates/qc-audio",
    "crates/qc-render",
    "crates/qc-export",
    "crates/qc-cli",
    "apps/desktop",
]
# Desktop is the product: a bare `cargo run` or `cargo build` at the repo root
# targets the app, not the CLI.
default-members = ["apps/desktop"]

[workspace.package]
edition = "2021"
license = "MIT"
