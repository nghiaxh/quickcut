name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.1.0
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # FFmpeg is not bundled: libx264 is GPL, so shipping it would impose GPL on
      # anyone downloading the binary. README says to install it separately.
      - name: build
        run: cargo build -p qc-cli --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/quickcut"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN="$BIN.exe"; fi
          NAME="quickcut-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "$BIN" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "$NAME.zip" "$NAME"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: quickcut-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: quickcut-*
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes \
            || gh release upload "$TAG" dist/* --clobber