name: ci
on: [push, pull_request]
jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # --all-targets matters: without it clippy skips tests and benches, which is
      # where most of the code lives once the suite grows.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  desktop:
    # Separate Cargo workspace, so root commands never see it.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --workspace --all-targets -- -D warnings