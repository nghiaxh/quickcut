name: ci
on: [push, pull_request]
jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # eframe/egui need the usual GUI system packages on Linux.
      - name: linux gui deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      # --all-targets matters: without it clippy skips tests and benches, which is
      # where most of the code lives once the suite grows.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
