schema_version = 1

[output]
fps = 30
width = 1080
height = 1920

[background]
kind = "blur_from_image"
blur_sigma = 40.0
dim = 0.35

[layout]
margin_x = 60
corner_radius = 28
long_image = "auto_scroll"

[layout.shadow]
blur = 30
dy = 12
alpha = 0.35

[timing]
pad_before = 0.25
pad_after = 0.35
default_hold = 2.5
transition = 0.30

[audio]
voice_gain_db = 0.0
sfx_gain_db = -8.0

[audio.master]
target_lufs = -14.0
true_peak_db = -1.0

[[scene]]
image = "01.png"
voice = "01.wav"
anim_in = "pop"
anim_out = "slide_left"

[[scene]]
image = "02.png"
voice = "02.wav"
anim_in = "pop"
anim_out = "slide_left"
transition_sfx = "whoosh"